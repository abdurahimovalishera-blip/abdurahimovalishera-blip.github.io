<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sertifikatni tekshirish — alisher.live</title>
<meta name="description" content="alisher.live sertifikati haqiqiyligini tekshirish.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F8;--panel:#fff;--line:rgba(17,24,39,.1);--line2:rgba(17,24,39,.18);--tx:#111827;--tx2:#4B5563;--tx3:#6B7280;--sea:#0E7490;--ok:#047857;--bad:#BE123C;
  --f-b:'Onest',system-ui,sans-serif;--f-m:'Geist Mono',ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07080B;--panel:#0F1115;--line:rgba(160,200,230,.12);--line2:rgba(160,200,230,.2);--tx:#EAF2FB;--tx2:#A9BED0;--tx3:#6F8598;--sea:#38BDF8;--ok:#34D399;--bad:#FB7185;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:400 16px/1.6 var(--f-b);display:grid;place-items:center;padding:24px max(18px,env(safe-area-inset-left,0px))}
.card{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px 26px;box-shadow:0 30px 70px -40px rgba(17,24,39,.4)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;text-decoration:none;color:var(--tx)}
.brand .mk{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#0E7490,#1E3A8A);display:grid;place-items:center;color:#fff;font:600 23px var(--f-b);padding-bottom:3px}
.brand b{font:600 19px var(--f-b);letter-spacing:-.01em}
h1{font:600 24px/1.2 var(--f-b);letter-spacing:-.02em;margin:0 0 6px}
.lead{margin:0 0 20px;color:var(--tx2);font-size:14.5px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 220px;min-width:0;border:1px solid var(--line2);background:var(--bg);color:var(--tx);border-radius:12px;padding:13px 15px;font:500 16px var(--f-m);letter-spacing:.04em;text-transform:uppercase}
button{border:0;border-radius:12px;padding:13px 22px;font:600 15px var(--f-b);cursor:pointer;color:#fff;background:linear-gradient(135deg,#0E7490,#1E3A8A)}
button:disabled{opacity:.6}
.res{margin-top:22px;border-radius:16px;padding:20px;border:1px solid var(--line);display:none}
.res.show{display:block;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.res.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.res.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.badge{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--f-b);margin-bottom:12px}
.badge.ok{color:var(--ok)}.badge.bad{color:var(--bad)}
.badge svg{width:20px;height:20px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.row:first-of-type{border-top:0}
.row span{color:var(--tx3)}.row b{text-align:right}
.name{font:600 22px var(--f-b);margin:2px 0 10px}
.back{display:inline-block;margin-top:20px;color:var(--sea);text-decoration:none;font-weight:600;font-size:14px}
.err{color:var(--bad);font-size:13.5px;margin:10px 0 0;min-height:1.1em}
</style>
</head>
<body>
<div class="card">
  <a class="brand" href="/"><span class="mk">a</span><b>alisher.live</b></a>
  <h1>Sertifikatni tekshirish</h1>
  <p class="lead">Sertifikatdagi tekshiruv kodini kiriting — uning haqiqiyligini va kimga berilganini koʻrsatamiz.</p>
  <form id="f" novalidate>
    <input id="code" name="code" maxlength="20" placeholder="ALV-XXXXX-2026" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button type="submit" id="go">Tekshirish</button>
  </form>
  <p class="err" id="err" aria-live="polite"></p>
  <div class="res" id="res" aria-live="polite"></div>
  <a class="back" href="/">← Bosh sahifaga qaytish</a>
</div>
<script>
(function(){
  'use strict';
  var API = 'https://alisher-contact.abdurahimovalishera.workers.dev';
  var f = document.getElementById('f'), inp = document.getElementById('code'), go = document.getElementById('go'), err = document.getElementById('err'), res = document.getElementById('res');
  var MON = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); }
  function fmtDate(ts){ try { var d = new Date(ts * 1000); return d.getDate() + '-' + MON[d.getMonth()] + ', ' + d.getFullYear() + '-yil'; } catch (e) { return ''; } }
  function fmt(n){ return String(n == null ? 0 : n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  var ICO_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>';
  var ICO_BAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
  async function check(code){
    err.textContent = ''; res.className = 'res'; go.disabled = true; go.textContent = '…';
    try {
      var r = await fetch(API + '/cert/' + encodeURIComponent(code), { headers: { 'accept': 'application/json' } });
      var j = await r.json().catch(function(){ return {}; });
      if (r.ok && j.ok) {
        var pct = j.total ? Math.round(j.correct / j.total * 100) : (j.pct || 0);
        res.className = 'res ok show';
        res.innerHTML = '<div class="badge ok">' + ICO_OK + 'Sertifikat haqiqiy</div>'
          + '<div class="name">' + esc(j.name) + '</div>'
          + '<div class="row"><span>Yoʻnalish</span><b>' + esc(j.dir || 'Bilimlar viktorinasi') + '</b></div>'
          + '<div class="row"><span>Natija</span><b>' + fmt(j.points) + ' ball · ' + pct + '%' + (j.correct != null ? ' · ' + j.correct + '/' + j.total : '') + '</b></div>'
          + (j.rank ? '<div class="row"><span>Dunyo reytingi</span><b>#' + fmt(j.rank) + '</b></div>' : '')
          + '<div class="row"><span>Berilgan sana</span><b>' + fmtDate(j.date) + '</b></div>'
          + '<div class="row"><span>Kod</span><b>' + esc(code) + '</b></div>';
      } else {
        res.className = 'res bad show';
        res.innerHTML = '<div class="badge bad">' + ICO_BAD + 'Bunday sertifikat topilmadi</div><p style="margin:0;color:var(--tx2);font-size:14px">Kodni tekshiring. Sertifikat alisher.live viktorinasida berilgan boʻlishi kerak.</p>';
      }
    } catch (e) {
      err.textContent = 'Xatolik. Internetni tekshiring.';
    }
    go.disabled = false; go.textContent = 'Tekshirish';
  }
  f.addEventListener('submit', function(e){ e.preventDefault(); var c = inp.value.trim().toUpperCase(); if (c.length < 5) { err.textContent = 'Kodni kiriting.'; return; } location.hash = c; check(c); });
  function fromHash(){ var h = (location.hash || '').replace('#', '').trim().toUpperCase(); if (h.length >= 5) { inp.value = h; check(h); } }
  addEventListener('hashchange', fromHash); fromHash();
})();
</script>
</body>
</html>
