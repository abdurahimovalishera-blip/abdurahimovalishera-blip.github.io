<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Testlar — alisher.live</title>
<meta name="description" content="Ingliz tili bosqichma-bosqich, abituriyentlar uchun fanlar, psixologik, IQ va mantiq testlari.">
<meta name="theme-color" content="#07080B">
<link rel="canonical" href="https://alisher.live/testlar.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#07080B; --bg2:#0C0E13; --panel:#101217;
  --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.17);
  --tx:#F3F4F6; --tx2:#A4A9B5; --tx3:#6F7581;
  --amber:#FFB547; --ember:#FF7A45; --blue:#7EA6FF;
  --ok:#3DDC97; --bad:#FF6B6B;
  --r:20px;
  --f-d:"Geist",Onest,system-ui,sans-serif;
  --f-b:Onest,system-ui,sans-serif;
  --f-m:"Geist Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 var(--f-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:10px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.125em}

/* Header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(7,8,11,.95),rgba(7,8,11,.82));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-t{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#FFE0A8,var(--amber) 45%,var(--ember));color:#111;display:grid;place-items:center;font:600 17px var(--f-d);box-shadow:0 0 22px -4px rgba(255,140,60,.55)}
.logo span:last-child{font:500 17px var(--f-d);letter-spacing:-.02em}
nav{display:flex;gap:2px;margin-left:auto;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--glass);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{text-decoration:none;color:var(--tx2);font-size:14.5px;padding:7px 14px;border-radius:999px;white-space:nowrap}
nav a:hover{color:var(--tx);background:var(--glass2)}
nav a[aria-current="page"]{background:var(--tx);color:#0B0C10}

/* Hero */
.hero{padding:44px 0 18px}
.crumbs{font:500 12.5px var(--f-m);color:var(--tx3);margin:0 0 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--tx2);cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:3px}
h1{font:500 clamp(30px,4.6vw,48px)/1.05 var(--f-d);letter-spacing:-.035em;margin:0 0 10px}
.lead{color:var(--tx2);max-width:640px;margin:0;font-size:16.5px}

/* Yoʻnalish kartalari */
.dirs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:22px 0 60px}
.dir{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:20px;text-align:left;cursor:pointer;min-height:188px;display:flex;flex-direction:column;gap:6px;overflow:hidden;isolation:isolate;
  background:radial-gradient(90% 80% at 85% 0%,color-mix(in srgb,var(--c) 30%,transparent),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.012));background-color:rgba(12,13,18,.8);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.dir:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:0 24px 50px -26px color-mix(in srgb,var(--c) 80%,transparent)}
.dir.main{grid-column:span 2}
.dir .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);margin-bottom:8px}
.dir h3{margin:0;font:500 19px/1.2 var(--f-d);letter-spacing:-.015em}
.dir p{margin:0;color:var(--tx2);font-size:14.5px}
.dir .tag{margin-top:auto;padding-top:10px;font:500 12px var(--f-m);color:var(--tx3);display:flex;gap:8px;flex-wrap:wrap}
.dir .tag b{color:var(--c);font-weight:500}
.dir .soon{position:absolute;top:16px;right:16px;font:500 11.5px var(--f-m);padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2);background:rgba(10,11,15,.6)}
.note{font-size:13px;color:var(--tx3);border-left:2px solid var(--line2);padding:2px 0 2px 12px;margin:-36px 0 60px}

/* Bosqichlar */
.levels{display:grid;gap:12px;padding:24px 0 60px}
.lvl{border:1px solid var(--line);border-radius:var(--r);background:var(--glass);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.lvl.locked{opacity:.55}
.badge{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font:500 20px var(--f-d);letter-spacing:-.02em;color:#0B0C10;background:linear-gradient(135deg,#FFE0A8,var(--amber) 50%,var(--ember))}
.lvl.locked .badge{background:var(--glass2);color:var(--tx3)}
.lvl h3{margin:2px 0 2px;font:500 18px var(--f-d)}
.lvl .sub{margin:0 0 12px;color:var(--tx2);font-size:14px}
.ex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.exb{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);border-radius:14px;background:rgba(10,11,15,.55);padding:12px;cursor:pointer;transition:border-color .2s,background .2s}
.exb:hover:not([disabled]){border-color:var(--line2);background:var(--glass2)}
.exb[disabled]{cursor:not-allowed}
.exb .t{font-weight:500;font-size:14.5px;display:flex;gap:8px;align-items:center}
.exb .s{font:400 12px var(--f-m);color:var(--tx3)}
.bar2{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--ok);border-radius:4px}
.exb.done .s{color:var(--ok)}
.lockmsg{font:400 12.5px var(--f-m);color:var(--tx3);margin-top:10px;display:flex;gap:6px;align-items:center}

/* Savol oynasi */
.quiz{max-width:720px;margin:0 auto;padding:24px 0 70px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;font:500 13px var(--f-m);color:var(--tx2)}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:22px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--ember));transition:width .35s ease}
.card{border:1px solid var(--line);border-radius:24px;background:radial-gradient(120% 90% at 50% 0%,#141821 0%,#0A0B0F 65%);padding:26px}
.kind{font:500 12px var(--f-m);color:var(--amber);letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}
.qtext{font:500 clamp(21px,3.2vw,28px)/1.25 var(--f-d);letter-spacing:-.02em;margin:0 0 6px}
.qtext .gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--amber);margin:0 4px}
.qword{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.say{border:1px solid var(--line2);background:var(--glass);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;color:var(--tx2);display:inline-flex;gap:6px;align-items:center}
.say:hover{color:var(--tx);background:var(--glass2)}
.hint{color:var(--tx3);font-size:14px;margin:0 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.opt{text-align:left;border:1px solid var(--line2);border-radius:14px;background:rgba(255,255,255,.03);padding:14px 16px;cursor:pointer;font-size:16px;display:flex;gap:12px;align-items:center;transition:background .15s,border-color .15s}
.opt:hover:not([disabled]){background:var(--glass2)}
.opt .k{font:500 12px var(--f-m);color:var(--tx3);width:22px;height:22px;border-radius:7px;border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.right .k{border-color:var(--ok);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.fb{margin-top:16px;padding:12px 14px;border-radius:14px;font-size:14.5px;display:none}
.fb.show{display:block}
.fb.ok{background:color-mix(in srgb,var(--ok) 10%,transparent);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.fb.no{background:color-mix(in srgb,var(--bad) 9%,transparent);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.fb b{font-weight:600}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:500;cursor:pointer;background:var(--tx);color:#0B0C10;display:inline-flex;gap:8px;align-items:center}
.btn.ghost{background:var(--glass);color:var(--tx);border:1px solid var(--line2)}
.btn:hover{filter:brightness(.92)}

/* Natija */
.res{text-align:center}
.big{font:300 clamp(64px,10vw,96px)/1 var(--f-d);letter-spacing:-.05em;margin:6px 0}
.big small{font-size:.35em;color:var(--tx2);letter-spacing:0}
.verdict{font:500 18px var(--f-d);margin:0 0 6px}
.verdict.pass{color:var(--ok)}
.review{text-align:left;margin-top:22px;display:grid;gap:8px}
.review h4{margin:0 0 4px;font:500 14px var(--f-m);color:var(--tx2)}
.rv{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;background:rgba(255,255,255,.02)}
.rv .a{color:var(--ok)}
.rv .y{color:var(--bad);text-decoration:line-through}

footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--tx3);font-size:13px}
footer .wrap{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}

@media (max-width:860px){
  .dirs{grid-template-columns:1fr 1fr}
  .dir.main{grid-column:span 2}
  .ex{grid-template-columns:1fr}
}
@media (max-width:560px){
  .bar{height:auto;padding:10px 0;flex-wrap:wrap}
  nav{margin-left:0;width:100%}
  .dirs{grid-template-columns:1fr}
  .dir.main{grid-column:auto}
  .lvl{grid-template-columns:1fr}
  .badge{width:48px;height:48px;font-size:17px}
  .opts{grid-template-columns:1fr}
  .card{padding:20px}
  .note{margin-top:-40px}
}

/* Yoʻnalish ichidagi testlar */
.tlist{display:grid;gap:12px;padding:22px 0 50px}
.tcard{display:flex;gap:16px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;cursor:pointer;
  background:radial-gradient(70% 120% at 100% 0%,color-mix(in srgb,var(--c) 18%,transparent),transparent 60%),var(--glass);transition:border-color .2s,transform .2s}
.tcard:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line));transform:translateY(-2px)}
.tc-main{flex:1;display:flex;flex-direction:column;gap:4px}
.tcard h3{margin:0;font:500 18px var(--f-d)}
.tcard p{margin:0;color:var(--tx2);font-size:14.5px}
.tcard .s{font:400 12.5px var(--f-m);color:var(--tx3);margin-top:4px}
.tcard .go{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);font-size:18px;flex:none}
.pc{font:400 13px var(--f-m);color:var(--tx2)}
.h1s{font:500 clamp(26px,3.6vw,36px)/1.1 var(--f-d);letter-spacing:-.03em;margin:6px 0 8px}
.disc{font-size:13px;color:var(--tx3);margin:18px 0 0;border-left:2px solid var(--line2);padding:2px 0 2px 12px;text-align:left}
.tip{font-size:14.5px;color:var(--tx);background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;margin:14px 0 0}
/* Shkala */
.scale{display:grid;gap:12px;margin-top:22px}
.sq{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0;background:var(--glass)}
.sq legend{padding:0;font-weight:500;font-size:15.5px;float:left;width:100%;margin-bottom:10px}
.sq .n{color:var(--tx3);font:500 13px var(--f-m);margin-right:4px}
.sopts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;clear:both}
.sopts label{position:relative;cursor:pointer}
.sopts input{position:absolute;opacity:0;inset:0}
.sopts span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:6px;border:1px solid var(--line2);border-radius:10px;font-size:12.5px;color:var(--tx2);line-height:1.25;transition:background .15s,border-color .15s}
.sopts input:checked+span{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:var(--ok);color:var(--tx)}
.sopts input:focus-visible+span{outline:2px solid var(--amber);outline-offset:2px}
.formerr{color:var(--bad);margin:0;font-size:14px}
.meter{position:relative;height:8px;border-radius:8px;margin:6px auto 16px;max-width:360px;background:linear-gradient(90deg,var(--ok),var(--amber),var(--bad))}
.meter i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--tx);border:3px solid var(--bg);transform:translate(-50%,-50%)}
/* Belgilar */
.checks{display:grid;gap:8px;margin-top:20px}
.ck{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;background:var(--glass);position:relative}
.ck input{position:absolute;opacity:0}
.ck .box{width:24px;height:24px;border-radius:7px;border:1px solid var(--line2);display:grid;place-items:center;flex:none;color:transparent}
.ck input:checked+.box{background:var(--ok);border-color:var(--ok);color:#0B0C10}
.ck input:focus-visible+.box{outline:2px solid var(--amber);outline-offset:2px}
.alert{display:flex;gap:10px;align-items:flex-start;border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:14px;padding:12px 14px;margin-top:16px;font-size:14.5px;text-align:left}
.alert svg{color:var(--bad);font-size:20px;margin-top:1px}
.big-alert{font-size:16px;padding:16px}
/* Kartochkalar */
.qcards{display:grid;gap:10px;margin-top:20px}
.qc{border:1px solid var(--line);border-radius:16px;background:var(--glass);overflow:hidden}
.qc summary{display:flex;gap:12px;align-items:center;padding:16px;cursor:pointer;list-style:none;font-weight:500}
.qc summary::-webkit-details-marker{display:none}
.qc .n{font:500 12px var(--f-m);color:var(--tx3);width:26px;height:26px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.qc .q{flex:1}
.qc .pl{width:14px;height:14px;position:relative;flex:none}
.qc .pl::before,.qc .pl::after{content:"";position:absolute;left:0;top:6px;width:14px;height:2px;background:var(--tx2);border-radius:2px;transition:transform .2s}
.qc .pl::after{transform:rotate(90deg)}
.qc[open] .pl::after{transform:rotate(0)}
.qc-b{padding:0 16px 16px 54px;color:var(--tx2);font-size:15px}
.qc-b p{margin:0 0 10px}
.qc-b .lb{font:500 11.5px var(--f-m);letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin:4px 0 4px}
.qc-b .sample{color:var(--tx);border-left:2px solid var(--amber);padding-left:12px;font-style:italic}
@media (max-width:560px){
  .sopts{grid-template-columns:1fr}
  .sopts span{justify-content:flex-start;padding:10px 12px;font-size:14px;min-height:0}
  .qc-b{padding-left:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(() => {

const PASS = 80;   // ingliz tilida keyingi bosqich uchun kerakli foiz

/* ================= SAQLASh (faqat shu qurilmada) ================= */
const KEY = 'alisher_tests_v1';
let mem = {};
function load(){ try { mem = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { mem = {}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} }
function best(lv, kind){ return (mem[lv + ':' + kind] || 0); }
function levelScore(lv){ return Math.round(['words','gap','gram'].reduce((s,k) => s + best(lv,k), 0) / 3); }
function unlocked(idx){
  if (idx === 0) return true;
  const prev = LEVELS[idx - 1];
  return ['words','gap','gram'].every(k => best(prev.id, k) >= PASS);
}

/* ================= YORDAMChILAR ================= */
const app = document.getElementById('app');
const ic = id => `<svg class="i" aria-hidden="true"><use href="#${id}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function speak(text){
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/^to /, ''));
    u.lang = 'en-US'; u.rate = .9; speechSynthesis.speak(u);
  } catch (e) {}
}
function go(view){ location.hash = view; }
function top(){ window.scrollTo(0, 0); }
const dirOf = id => DIRS.find(d => d.id === id);
function crumbs(parts){
  return `<div class="crumbs">${parts.map(p => p.href != null ? `<button type="button" data-go="${esc(p.href)}">${esc(p.t)}</button>` : `<span>${esc(p.t)}</span>`).join('<span>/</span>')}</div>`;
}
function wireCrumbs(){ app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go)); }
function band(bands, v){ return bands.find(b => v <= b[0]) || bands[bands.length - 1]; }

/* ================= BOSH SAHIFA ================= */
function renderHome(){
  app.innerHTML = `
    <section class="hero">
      <h1>Testlar</h1>
      <p class="lead">Bilimingizni tekshiring va bosqichma-bosqich oʻsib boring. Hamma testlar bepul, roʻyxatdan oʻtish shart emas.</p>
    </section>
    <section class="dirs">
      ${DIRS.map(d => {
        const n = d.id === 'english' ? null : TESTS.filter(t => t.dir === d.id).length;
        return `
        <button class="dir${d.main ? ' main' : ''}" style="--c:${d.c}" data-dir="${d.id}" type="button">
          <span class="ic">${ic(d.ic)}</span>
          <h3>${esc(d.t)}</h3>
          <p>${esc(d.d)}</p>
          <span class="tag">${d.tag ? d.tag.map((x,i) => i === 0 ? `<b>${esc(x)}</b>` : esc(x)).join(' · ') : `<b>${n} ta test</b>`}</span>
        </button>`;
      }).join('')}
    </section>
    <p class="note">Psixologik, IQ va homiladorlik testlari maʼlumot uchun moʻljallangan. Ular shifokor yoki psixolog xulosasining oʻrnini bosmaydi.</p>`;
  app.querySelectorAll('[data-dir]').forEach(b => b.onclick = () => go(b.dataset.dir === 'english' ? 'english' : 'd/' + b.dataset.dir));
}

/* ================= INGLIZ TILI ================= */
function renderEnglish(){
  app.innerHTML = `
    <section class="hero">
      ${crumbs([{t:'Testlar', href:''}, {t:'Ingliz tili'}])}
      <h1>Ingliz tili</h1>
      <p class="lead">Har bir bosqichda uch xil mashq bor. Uchalasidan ${PASS}% va undan yuqori natija olsangiz, keyingi bosqich ochiladi.</p>
    </section>
    <section class="levels">
      ${LEVELS.map((L, i) => {
        const open = unlocked(i);
        const sc = levelScore(L.id);
        return `
        <div class="lvl${open ? '' : ' locked'}">
          <div class="badge">${L.id}</div>
          <div>
            <h3>${esc(L.t)}${sc ? ` <span class="pc">· ${sc}%</span>` : ''}</h3>
            <p class="sub">${esc(L.d)}</p>
            <div class="ex">
              ${['words','gap','gram'].map(k => {
                const b = best(L.id, k);
                return `<button class="exb${b >= PASS ? ' done' : ''}" type="button" data-lv="${L.id}" data-k="${k}" ${open ? '' : 'disabled'}>
                  <span class="t">${b >= PASS ? ic('i-check') : ''}${esc(KIND[k].t)}</span>
                  <span class="s">${b ? 'eng yaxshi: ' + b + '%' : L[k].length + ' ta savol'}</span>
                  <span class="bar2"><i style="width:${b}%"></i></span>
                </button>`;
              }).join('')}
            </div>
            ${open ? '' : `<div class="lockmsg">${ic('i-lock')} Ochish uchun ${LEVELS[i-1].id} bosqichining uchala mashqidan ${PASS}% oling</div>`}
          </div>
        </div>`;
      }).join('')}
    </section>`;
  wireCrumbs();
  app.querySelectorAll('.exb:not([disabled])').forEach(b => b.onclick = () => go('q/' + b.dataset.lv + '/' + b.dataset.k));
}

/* ================= YOʻNALISh SAHIFASI ================= */
const TYPE_LBL = { quiz:'savol', scale:'bayonot', check:'belgi', cards:'savol' };
function renderDir(id){
  const d = dirOf(id);
  if (!d || id === 'english') { go(''); return; }
  const list = TESTS.filter(t => t.dir === id);
  app.innerHTML = `
    <section class="hero">
      ${crumbs([{t:'Testlar', href:''}, {t:d.t}])}
      <h1>${esc(d.t)}</h1>
      <p class="lead">${esc(d.d)}</p>
    </section>
    <section class="tlist" style="--c:${d.c}">
      ${list.map(t => {
        const b = mem['t:' + t.id];
        return `
        <button class="tcard" type="button" data-t="${t.id}">
          <span class="tc-main">
            <h3>${esc(t.t)}</h3>
            <p>${esc(t.d)}</p>
            <span class="s">${t.items.length} ta ${TYPE_LBL[t.type]}${b != null && t.type === 'quiz' ? ` · eng yaxshi: ${b}%` : ''}</span>
          </span>
          <span class="go">${ic('i-arrow')}</span>
        </button>`;
      }).join('')}
    </section>
    ${d.warn ? `<p class="note">${esc(d.warn)}</p>` : ''}`;
  wireCrumbs();
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => go('t/' + b.dataset.t));
}

/* ================= TEST TURLARI ================= */
function runTest(id){
  const t = TESTS.find(x => x.id === id);
  if (!t) { go(''); return; }
  const d = dirOf(t.dir);
  const ctx = { back:'d/' + t.dir, path:[{t:'Testlar', href:''}, {t:d.t, href:'d/' + t.dir}, {t:t.t}], key:'t:' + t.id, test:t };
  if (t.type === 'quiz') startQuizFrom(t.items, ctx, 'Toʻgʻri variantni tanlang.', t.t);
  else if (t.type === 'scale') renderScale(t, ctx);
  else if (t.type === 'check') renderCheck(t, ctx);
  else if (t.type === 'cards') renderCards(t, ctx);
}

/* --- Savol-javob (quiz) --- */
let Q = null;
function startEnglish(lv, kind){
  const L = LEVELS.find(x => x.id === lv);
  if (!L || !L[kind] || !unlocked(LEVELS.indexOf(L))) { go('english'); return; }
  const ctx = { back:'english', path:[{t:'Testlar', href:''}, {t:'Ingliz tili', href:'english'}, {t:lv + ' · ' + KIND[kind].t}], key:lv + ':' + kind, kind, eng:true, pass:PASS };
  startQuizFrom(L[kind], ctx, KIND[kind].h, KIND[kind].t);
}
function startQuizFrom(raw, ctx, hint, label){
  const items = shuffle(raw).map(q => ({ q: q[0], right: q[1][0], opts: shuffle(q[1]), why: q[2] || '' }));
  Q = { items, n: 0, ok: 0, wrong: [], ctx, hint, label };
  renderQ();
}
function renderQ(){
  const it = Q.items[Q.n], total = Q.items.length, c = Q.ctx;
  const isWord = c.kind === 'words', enQ = c.eng && c.kind !== 'words' && c.kind !== 'gram';
  const qhtml = isWord
    ? `<div class="qword"><p class="qtext" lang="en">${esc(it.q)}</p><button class="say" type="button" data-say>${ic('i-vol')} Eshitish</button></div>`
    : `<p class="qtext"${enQ ? ' lang="en"' : ''}>${esc(it.q).replace('___', '<span class="gap"></span>')}</p>`;
  app.innerHTML = `
    <section class="quiz">
      ${crumbs(c.path)}
      <div class="qhead"><span>${Q.n + 1} / ${total}</span><span>${ic('i-check')} ${Q.ok}</span></div>
      <div class="prog"><i style="width:${(Q.n / total) * 100}%"></i></div>
      <div class="card">
        <p class="kind">${esc(Q.label)}</p>
        ${qhtml}
        <p class="hint">${esc(Q.hint)}</p>
        <div class="opts">
          ${it.opts.map((o, i) => `<button class="opt" type="button" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span${c.eng && !isWord ? ' lang="en"' : ''}>${esc(o)}</span></button>`).join('')}
        </div>
        <div class="fb" role="status" aria-live="polite"></div>
        <div class="actions" hidden><button class="btn" type="button" data-next>${Q.n + 1 < total ? 'Keyingi' : 'Natijani koʻrish'} ${ic('i-arrow')}</button></div>
      </div>
    </section>`;
  wireCrumbs();
  const sb = app.querySelector('[data-say]'); if (sb) sb.onclick = () => speak(it.q);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b));
  app.querySelector('[data-next]').onclick = () => { Q.n++; if (Q.n < total) { renderQ(); top(); } else finishQuiz(); };
}
function answer(btn){
  const it = Q.items[Q.n];
  const pick = it.opts[+btn.dataset.i];
  const ok = pick === it.right;
  app.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (it.opts[+b.dataset.i] === it.right) b.classList.add('right'); });
  if (ok) Q.ok++; else { btn.classList.add('wrong'); Q.wrong.push({ q: it.q, right: it.right, you: pick }); }
  const fb = app.querySelector('.fb');
  fb.className = 'fb show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = (ok ? '<b>Toʻgʻri!</b> ' : `<b>Notoʻgʻri.</b> Toʻgʻri javob: <b>${esc(it.right)}</b>. `) + esc(it.why);
  app.querySelector('.actions').hidden = false;
  app.querySelector('[data-next]').focus();
}
function finishQuiz(){
  const total = Q.items.length, pct = Math.round(Q.ok / total * 100), c = Q.ctx;
  const prevBest = mem[c.key] || 0;
  if (pct > prevBest || mem[c.key] == null) { mem[c.key] = Math.max(pct, prevBest); save(); }
  let verdict;
  if (c.eng) verdict = pct >= PASS ? `<p class="verdict pass">Ajoyib! Bu mashqni muvaffaqiyatli tugatdingiz.</p>` : `<p class="verdict">${pct}%. Keyingi bosqich uchun ${PASS}% kerak — yana bir urinib koʻring.</p>`;
  else if (c.test && c.test.bands) { const b = band(c.test.bands, Q.ok); verdict = `<p class="verdict pass">${esc(b[1])}</p><p class="hint" style="margin:0 0 4px">${esc(b[2])}</p>`; }
  else verdict = `<p class="verdict${pct >= 70 ? ' pass' : ''}">${pct >= 90 ? 'Aʼlo natija!' : pct >= 70 ? 'Yaxshi natija!' : pct >= 50 ? 'Yomon emas, yana mashq qiling.' : 'Mavzuni takrorlab, qayta urinib koʻring.'} ${pct}%</p>`;
  app.innerHTML = `
    <section class="quiz">
      ${crumbs(c.path)}
      <div class="prog"><i style="width:100%"></i></div>
      <div class="card res">
        <p class="kind">Natija</p>
        <div class="big">${Q.ok}<small> / ${total}</small></div>
        ${verdict}
        <p class="hint" style="margin:0">${pct > prevBest && prevBest ? 'Yangi eng yaxshi natija!' : (prevBest ? 'Eng yaxshi natijangiz: ' + Math.max(pct, prevBest) + '%' : '')}</p>
        ${c.test && c.test.note ? `<p class="disc">${esc(c.test.note)}</p>` : ''}
        ${Q.wrong.length ? `<div class="review"><h4>Xatolar ustida ishlash</h4>${Q.wrong.map(w => `<div class="rv"><span${c.eng ? ' lang="en"' : ''}>${esc(w.q)}</span><br><span class="y">${esc(w.you)}</span> → <span class="a">${esc(w.right)}</span></div>`).join('')}</div>` : ''}
        <div class="actions" style="justify-content:center">
          <button class="btn ghost" type="button" data-again>${ic('i-redo')} Qayta ishlash</button>
          <button class="btn" type="button" data-go="${esc(c.back)}">Roʻyxatga qaytish</button>
        </div>
      </div>
    </section>`;
  wireCrumbs();
  app.querySelector('[data-again]').onclick = () => { const h = location.hash; route(true); top(); };
  top();
}

/* --- Shkala (psixologik) --- */
function renderScale(t, ctx){
  app.innerHTML = `
    <section class="quiz">
      ${crumbs(ctx.path)}
      <h1 class="h1s">${esc(t.t)}</h1>
      <p class="lead">${esc(t.d)}</p>
      <form class="scale" novalidate>
        ${t.items.map((it, i) => `
          <fieldset class="sq">
            <legend><span class="n">${i + 1}.</span> ${esc(it[0])}</legend>
            <div class="sopts">
              ${t.scale.map((s, j) => `<label><input type="radio" name="q${i}" value="${j}"><span>${esc(s)}</span></label>`).join('')}
            </div>
          </fieldset>`).join('')}
        <p class="formerr" hidden>Iltimos, barcha bayonotlarga javob bering.</p>
        <div class="actions"><button class="btn" type="submit">Natijani koʻrish ${ic('i-arrow')}</button></div>
      </form>
      <p class="disc">${esc(t.note || '')}</p>
    </section>`;
  wireCrumbs();
  const form = app.querySelector('form');
  form.onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(form);
    let sum = 0, miss = -1;
    t.items.forEach((it, i) => {
      const v = fd.get('q' + i);
      if (v == null) { if (miss < 0) miss = i; return; }
      const j = +v, n = t.values.length;
      sum += it[1] ? t.values[n - 1 - j] : t.values[j];
    });
    if (miss >= 0) {
      const err = form.querySelector('.formerr'); err.hidden = false;
      form.querySelectorAll('fieldset')[miss].scrollIntoView({ behavior:'smooth', block:'center' });
      return;
    }
    const max = t.values[t.values.length - 1] * t.items.length, min = t.values[0] * t.items.length;
    const b = band(t.bands, sum);
    app.innerHTML = `
      <section class="quiz">
        ${crumbs(ctx.path)}
        <div class="card res">
          <p class="kind">Natija</p>
          <div class="big">${sum}<small> / ${max}</small></div>
          <div class="meter"><i style="left:${((sum - min) / (max - min)) * 100}%"></i></div>
          <p class="verdict">${esc(b[1])}</p>
          <p class="hint">${esc(b[2])}</p>
          <p class="disc">${esc(t.note || '')}</p>
          <div class="actions" style="justify-content:center">
            <button class="btn ghost" type="button" data-again>${ic('i-redo')} Qayta topshirish</button>
            <button class="btn" type="button" data-go="${esc(ctx.back)}">Roʻyxatga qaytish</button>
          </div>
        </div>
      </section>`;
    wireCrumbs();
    app.querySelector('[data-again]').onclick = () => { renderScale(t, ctx); top(); };
    top();
  };
}

/* --- Belgilar roʻyxati (homiladorlik) --- */
function renderCheck(t, ctx){
  app.innerHTML = `
    <section class="quiz">
      ${crumbs(ctx.path)}
      <h1 class="h1s">${esc(t.t)}</h1>
      <p class="lead">${esc(t.d)}</p>
      ${t.danger ? `<div class="alert">${ic('i-alert')} <span>Ahvol keskin yomonlashsa, testni kutmang — darhol <b>103</b> raqamiga qoʻngʻiroq qiling.</span></div>` : ''}
      <form class="checks">
        ${t.items.map((s, i) => `<label class="ck"><input type="checkbox" name="c" value="${i}"><span class="box">${ic('i-check')}</span><span>${esc(s)}</span></label>`).join('')}
        <div class="actions"><button class="btn" type="submit">Natijani koʻrish ${ic('i-arrow')}</button></div>
      </form>
      <p class="disc">${esc(t.note || '')}</p>
    </section>`;
  wireCrumbs();
  const form = app.querySelector('form');
  form.onsubmit = e => {
    e.preventDefault();
    const n = form.querySelectorAll('input:checked').length;   // javoblar hech qayerga yuborilmaydi va saqlanmaydi
    let body;
    if (t.danger) {
      body = n
        ? `<div class="alert big-alert">${ic('i-alert')} <div><b>Kechiktirmang.</b> Siz belgilagan holat xavfli boʻlishi mumkin. Darhol shifokorga murojaat qiling yoki <b>103</b> raqamiga qoʻngʻiroq qiling.</div></div>`
        : `<p class="verdict pass">Roʻyxatdagi xavfli belgilar yoʻq</p><p class="hint">Rejali koʻrikdan qolmang va shifokor tavsiyalariga amal qiling.</p>`;
    } else {
      const b = band(t.bands, n);
      body = `<div class="big">${n}<small> / ${t.items.length}</small></div><p class="verdict">${esc(b[1])}</p><p class="hint">${esc(b[2])}</p><p class="tip">${esc(t.always)}</p>`;
    }
    app.innerHTML = `
      <section class="quiz">
        ${crumbs(ctx.path)}
        <div class="card res">
          <p class="kind">Natija</p>
          ${body}
          <p class="disc">${esc(t.note || '')}</p>
          <div class="actions" style="justify-content:center">
            <button class="btn ghost" type="button" data-again>${ic('i-redo')} Qayta belgilash</button>
            <button class="btn" type="button" data-go="${esc(ctx.back)}">Roʻyxatga qaytish</button>
          </div>
        </div>
      </section>`;
    wireCrumbs();
    app.querySelector('[data-again]').onclick = () => { renderCheck(t, ctx); top(); };
    top();
  };
}

/* --- Kartochkalar (ish suhbati) --- */
function renderCards(t, ctx){
  app.innerHTML = `
    <section class="quiz">
      ${crumbs(ctx.path)}
      <h1 class="h1s">${esc(t.t)}</h1>
      <p class="lead">Avval oʻzingiz javob berib koʻring, keyin maslahat va namunani oching.</p>
      <div class="qcards">
        ${t.items.map((it, i) => `
          <details class="qc">
            <summary><span class="n">${i + 1}</span><span class="q">${esc(it[0])}</span><span class="pl" aria-hidden="true"></span></summary>
            <div class="qc-b">
              <p class="lb">Maslahat</p><p>${esc(it[1])}</p>
              <p class="lb">Namunaviy javob</p><p class="sample">${esc(it[2])}</p>
            </div>
          </details>`).join('')}
      </div>
    </section>`;
  wireCrumbs();
}

/* ================= YOʻNALTIRISh ================= */
function route(){
  const h = location.hash.replace(/^#/, '');
  if (h === 'english') renderEnglish();
  else if (h.startsWith('q/')) { const [, lv, k] = h.split('/'); startEnglish(lv, k); }
  else if (h.startsWith('d/')) renderDir(h.slice(2));
  else if (h.startsWith('t/')) runTest(h.slice(2));
  else renderHome();
  top();
}
load();
window.addEventListener('hashchange', route);
route();
})();
</script>
